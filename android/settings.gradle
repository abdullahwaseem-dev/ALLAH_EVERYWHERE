pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.2" apply false
    // END: FlutterFire Configuration
    // Bumped from 2.0.20: google_mobile_ads pulls in play-services-ads,
    // whose AAR is compiled with Kotlin 2.3.0 metadata - an older compiler
    // can't read it ("Module was compiled with an incompatible version of
    // Kotlin"). Matching that version guarantees compatibility.
    id "org.jetbrains.kotlin.android" version "2.3.0" apply false
}

include ":app"
