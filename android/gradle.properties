org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Works around a Kotlin Gradle Plugin bug where incremental compilation
# crashes trying to compute a relative path between the pub cache and the
# project when they're on different Windows drive letters (e.g. C: pub
# cache, D: project) - "this and base files have different roots". Only
# affects build speed, not output correctness.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
